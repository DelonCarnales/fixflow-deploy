# Render Blueprint: one Docker web service plus a managed PostgreSQL database.
# Render does not host this repository's Docker Compose stack as a single service.
services:
  - type: web
    name: fixflow-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fixflow-db
          property: connectionString
      - key: PYTHONUNBUFFERED
        value: "1"
databases:
  - name: fixflow-db
    plan: free
    databaseName: fixflow
    user: fixflow
