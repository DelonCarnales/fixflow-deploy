name: Deploy Development

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-development:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Trigger Render Development deployment
        env:
          RENDER_DEV_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEV_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEV_DEPLOY_HOOK_URL" ]; then
            echo "::error::Add RENDER_DEV_DEPLOY_HOOK_URL to the development GitHub Environment."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEV_DEPLOY_HOOK_URL"
