name: Compose integration and E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compose-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install -r integration/requirements.txt
          python -m pip install -r e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Start PostgreSQL and the application
        run: docker compose up --build -d
      - name: Wait for Compose health
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql://fixflow:fixflow@localhost:5432/fixflow
        run: python -m pytest -q integration
      - name: Restart the app and verify database-backed data remains available
        run: |
          docker compose restart app
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:8000/health; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:8000/orders | grep -q "FF-1001"
      - name: Run Playwright E2E tests twice against the same database
        env:
          E2E_BASE_URL: http://localhost:8000
        run: |
          python -m pytest -q e2e
          python -m pytest -q e2e
      - name: Upload browser screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
      - name: Show Compose logs
        if: always()
        run: docker compose logs
      - name: Stop Compose stack
        if: always()
        run: docker compose down -v
