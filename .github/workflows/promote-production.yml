name: Promote Development to Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to deploy (defaults to the selected branch commit)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  promote:
    name: Manual Production promotion
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve and validate commit
        id: commit
        env:
          INPUT_SHA: ${{ inputs.commit_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          SHA="${INPUT_SHA:-$EVENT_SHA}"
          if ! [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Provide a full 40-character commit SHA."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Trigger Render Production deployment for the selected commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_PROD_SERVICE_ID: ${{ secrets.RENDER_PROD_SERVICE_ID }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_PROD_SERVICE_ID" ]; then
            echo "::error::Add RENDER_API_KEY and RENDER_PROD_SERVICE_ID to the production GitHub Environment."
            exit 1
          fi
          curl --fail --silent --show-error \
            --request POST "https://api.render.com/v1/services/$RENDER_PROD_SERVICE_ID/deploys" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "{\"commitId\":\"$COMMIT_SHA\",\"clearCache\":\"do_not_clear\"}"
      - name: Report deployment target
        run: echo "Requested Production deployment for commit ${{ steps.commit.outputs.sha }}. Wait for Render to finish and verify /health."
